[project]
name = "kidpy3"
version = "0.3.9-dev1+global_data+experimental_chunk_488"
description = ""
authors = [
    {name = "Cody Roberson",email = "carobers@asu.edu"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cython (>=3.1.3,<4.0.0)",
    "h5py (>=3.14.0,<4.0.0)",
    "redis (>=7.4.0,<8.0.0)",
    "numpy (>=2.3.2,<3.0.0)",
    "scipy (>=1.16.1,<2.0.0)",
    "matplotlib (>=3.10.5,<4.0.0)",
    "setuptools (>=82.0.1,<83.0.0)",
    "omegaconf (>=2.3.0,<3.0.0)",
    "pyserial (>=3.5,<4.0)",
    "tqdm (>=4.67.1,<5.0.0)",
    "requests (>=2.32.5,<3.0.0)"
]
[project.scripts]
kp3-mkconfig = "kidpy3.util:gen_config"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0", "setuptools", "cython"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.build.dependencies]
setuptools = ">=80.9.0"
cython = ">=3.1.3"

[tool.poetry]
include = [
    { path = "kidpy3/*.so", format = "wheel"},
]

# if not already excluded via .gitignore
exclude = [
    "**/*.c",
    "**/*.h"
]

[tool.poetry.build]
script = "scripts/build.py"
